
name: Heart Disease MLOps CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Train and Test ML Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff

      - name: Verify dataset
        run: |
          test -f data/heart_disease_raw.csv

      - name: Run code quality checks
        run: |
          ruff check src/ tests/ --output-format=github --select E4,E7,E9,F63,F7,F82

      - name: Train and evaluate models
        run: |
          python src/train.py 2>&1 | tee training.log
          test -f models/best_model.joblib
          test -f models/test_metrics.json
          test -f models/model_comparison.csv

      - name: Run automated tests
        run: |
          python -m pytest tests/ -v 2>&1 | tee pytest-results.log

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-ci-evidence
          path: |
            training.log
            pytest-results.log
            models/test_metrics.json
            models/model_comparison.csv
            screenshots/confusion_matrix.png
          if-no-files-found: warn
